<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Rasojadita Art Commissions</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo3.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-bg min-h-screen flex flex-col">

    <header class="hero-bg px-5 sm:px-10 py-4">
        <div class="flex items-center justify-between max-w-6xl mx-auto relative z-10">
            <a href="index.html" class="flex items-center gap-2">
                <img src="assets/logo3.svg" alt="Rasojadita purple cat logo" class="h-9 w-9">
                <span class="text-lg sm:text-xl font-extrabold text-white">Rasojadita</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="nav-link">Home</a>
                <div id="nav-auth" class="flex items-center gap-3"></div>
            </div>
        </div>
        <div id="mobile-auth" class="hidden"></div>
    </header>

    <p id="app-loading" class="text-center text-xs text-violet-500 bg-violet-50 py-1">Loading...</p>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="card w-full max-w-lg p-7 sm:p-9">
            <div class="text-center mb-6">
                <img src="assets/logo3.svg" alt="" class="w-16 h-16 mx-auto mb-2">
                <h1 class="text-2xl font-extrabold text-violet-900">Create your account</h1>
                <p class="text-sm text-slate-500">Join Rasojadita to send and track commission requests.</p>
            </div>

            <form id="register-form" class="space-y-4" onsubmit="return false;" novalidate>
                <div>
                    <label class="label" for="reg-fullname">Full name</label>
                    <input id="reg-fullname" type="text" class="field" autocomplete="name" placeholder="Juan Dela Cruz">
                    <p id="reg-fullname-error" class="field-error"></p>
                </div>
                <div>
                    <label class="label" for="reg-email">Email</label>
                    <input id="reg-email" type="email" class="field" autocomplete="email" placeholder="you@email.com">
                    <p id="reg-email-error" class="field-error"></p>
                </div>
                <div>
                    <label class="label" for="reg-username">Username</label>
                    <input id="reg-username" type="text" class="field" autocomplete="username" placeholder="juan_art">
                    <p id="reg-username-hint" class="field-hint"></p>
                    <p id="reg-username-error" class="field-error"></p>
                </div>
                <div>
                    <label class="label" for="reg-password">Password</label>
                    <div class="relative">
                        <input id="reg-password" type="password" class="field pr-16" autocomplete="new-password" placeholder="At least 8 characters, with a number">
                        <button type="button" class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-violet-600" data-target="reg-password">Show</button>
                    </div>
                    <div class="flex items-center gap-3 mt-2">
                        <div class="strength-track flex-1"><div id="pw-bar" class="strength-bar"></div></div>
                        <span id="pw-label" class="text-xs font-semibold text-slate-500 w-16 text-right"></span>
                    </div>
                    <p id="reg-password-error" class="field-error"></p>
                </div>
                <div>
                    <label class="label" for="reg-confirm">Confirm password</label>
                    <div class="relative">
                        <input id="reg-confirm" type="password" class="field pr-16" autocomplete="new-password" placeholder="Type your password again">
                        <button type="button" class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-violet-600" data-target="reg-confirm">Show</button>
                    </div>
                    <p id="reg-confirm-hint" class="field-hint"></p>
                    <p id="reg-confirm-error" class="field-error"></p>
                </div>
                <div id="register-status" class="hidden"></div>
                <button id="register-submit" type="submit" class="btn-glow w-full py-3">Create account</button>
            </form>

            <p class="text-center text-sm text-slate-600 mt-6">Already have an account? <a href="login.html" class="font-bold text-violet-700 hover:underline">Log in</a></p>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">&copy; <span id="year">2026</span> Rasojadita Art Commissions</footer>

    <script type="py" src="py/register.py" config="pyscript.toml"></script>
</body>
</html>
