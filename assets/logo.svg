      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <path d="M18 58 L14 14 L54 35 Z" fill="url(#fur)"/>
  <path d="M102 58 L106 14 L66 35 Z" fill="url(#fur)"/>
  <path d="M25 47 L23 27 L43 37 Z" fill="#f9a8d4"/>
  <path d="M95 47 L97 27 L77 37 Z" fill="#f9a8d4"/>
