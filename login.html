<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rasojadita Art Commissions</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo3.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-bg min-h-screen flex flex-col">

    <header class="hero-bg px-5 sm:px-10 py-4">
        <div class="flex items-center justify-between max-w-6xl mx-auto relative z-10">
            <a href="index.html" class="flex items-center gap-2">
                <img src="assets/logo3.svg" alt="Rasojadita purple cat logo" class="h-9 w-9">
                <span class="text-lg sm:text-xl font-extrabold text-white">Rasojadita</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="nav-link">Home</a>
                <div id="nav-auth" class="flex items-center gap-3"></div>
            </div>
        </div>
        <div id="mobile-auth" class="hidden"></div>
    </header>

    <p id="app-loading" class="text-center text-xs text-violet-500 bg-violet-50 py-1">Loading...</p>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="card w-full max-w-md p-7 sm:p-9">
            <div class="text-center mb-6">
                <img src="assets/logo3.svg" alt="" class="w-16 h-16 mx-auto mb-2">
                <h1 class="text-2xl font-extrabold text-violet-900">Welcome back</h1>
                <p class="text-sm text-slate-500">Log in to manage your commission requests.</p>
            </div>

            <form id="login-form" class="space-y-4" onsubmit="return false;" novalidate>
                <div>
                    <label class="label" for="login-identifier">Username or email</label>
                    <input id="login-identifier" type="text" class="field" autocomplete="username" placeholder="your_username">
                </div>
                <div>
                    <label class="label" for="login-password">Password</label>
                    <div class="relative">
                        <input id="login-password" type="password" class="field pr-16" autocomplete="current-password" placeholder="Your password">
                        <button type="button" class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-violet-600" data-target="login-password">Show</button>
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input id="login-remember" type="checkbox" class="w-4 h-4 accent-purple-600">
                    Remember me on this device
                </label>
                <div id="login-error" class="hidden"></div>
                <button id="login-submit" type="submit" class="btn-glow w-full py-3">Log in</button>
            </form>

            <p class="text-center text-sm text-slate-600 mt-6">New here? <a href="register.html" class="font-bold text-violet-700 hover:underline">Create an account</a></p>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">&copy; <span id="year">2026</span> Rasojadita Art Commissions</footer>

    <script type="py" src="py/login.py" config="pyscript.toml"></script>
</body>
</html>
